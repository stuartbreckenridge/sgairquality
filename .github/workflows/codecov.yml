name: Test and Upload Coverage to Codecov

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest # macOS runner is required for building/testing Xcode projects

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version (Optional, specify if needed)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable' # Replace with your desired Xcode version
      
      - name: Write Secrets xcconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p configuration
          echo "API_KEY = ${{ secrets.API_KEY }}" > configuration/Secrets.xcconfig

      - name: List available simulators (workaround)
        run: xcrun simctl list devices
      
      - name: Clean and Test Xcode project with coverage
        run: |
          xcodebuild clean build test \
            -project sgairquality.xcodeproj \
            -scheme sgairquality \
            -testPlan sgairquality \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=26.2' \
            -enableCodeCoverage YES \
            -resultBundlePath "${GITHUB_WORKSPACE}/build/test_results.xcresult"
          ls -la "${GITHUB_WORKSPACE}/build"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # Required for private repositories or if Codecov requires a token for public repos not on supported CI platforms
          # Store your token as a repository secret named CODECOV_TOKEN
          token: ${{ secrets.CODECOV_TOKEN }}
          # The Codecov action automatically detects the .xcresult bundle and processes it
          files: build/test_results.xcresult
          # Optional: Add a flag to distinguish coverage reports (e.g., 'ios-tests')
          flags: ios-tests
          verbose: true # Optional: enable verbose output for debugging

