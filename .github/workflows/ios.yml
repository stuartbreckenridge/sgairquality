name: iOS starter workflow

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Detect project + default scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(ls -1 *.xcodeproj | head -1)"
          echo "project=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"

          scheme_json="$(xcodebuild -list -json -project "$PROJECT")"
          scheme="$(ruby -rjson -e 'j=JSON.parse(STDIN.read); puts j["project"]["schemes"][0]' <<<"$scheme_json")"

          if [ -z "$scheme" ]; then
            echo "Could not determine a scheme. Ensure your scheme is Shared in Xcode." >&2
            exit 1
          fi

          echo "scheme=$scheme" >> "$GITHUB_ENV"
          echo "Using scheme: $scheme"

      - name: Build (for testing)
        shell: bash
        run: |
          set -euo pipefail

          echo "API_KEY = ${{ secrets.API_KEY }}" > configuration/Secrets.xcconfig

          device="$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e 's/ Simulator$//')"
          echo "Using device: $device"

          xcodebuild build-for-testing \
            -project "$project" \
            -scheme "$scheme" \
            -destination "platform=iOS Simulator,name=$device" \
            -resultBundlePath TestResults.xcresult

      - name: Test (no build)
        shell: bash
        run: |
          set -euo pipefail

          device="$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e 's/ Simulator$//')"

          xcodebuild test-without-building \
            -project "$project" \
            -scheme "$scheme" \
            -destination "platform=iOS Simulator,name=$device" \
            -testPlan sgairquality \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Convert Coverage to LCOV
        shell: bash
        run: |
          set -euo pipefail

          brew install xcresultparser 2>/dev/null || true
          xcresultparser --output-format lcov TestResults.xcresult > coverage.lcov
          ls -lah coverage.lcov

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: unittests
          fail_ci_if_error: false
