name: iOS starter workflow

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build:
    name: Build, Test, and Upload Coverage
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Detect project + scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "PWD=$(pwd)"
          ls -la

          XCODEPROJ="$(find . -maxdepth 3 -name '*.xcodeproj' -print | head -1)"
          if [ -z "${XCODEPROJ:-}" ]; then
            echo "No .xcodeproj found (is it in a subdirectory?)" >&2
            exit 1
          fi

          # Sanity check: pbxproj must exist inside the bundle
          if [ ! -f "$XCODEPROJ/project.pbxproj" ]; then
            echo "Found $XCODEPROJ but missing $XCODEPROJ/project.pbxproj" >&2
            echo "Possible causes: sparse checkout, submodule not fetched, LFS not pulled, wrong directory." >&2
            exit 1
          fi

          scheme_json="$(xcodebuild -list -json -project "$XCODEPROJ")"
          SCHEME="$(ruby -rjson -e 'j=JSON.parse(STDIN.read); puts j["project"]["schemes"][0]' <<<"$scheme_json")"

          if [ -z "${SCHEME:-}" ]; then
            echo "No schemes found. Ensure the scheme is Shared in Xcode." >&2
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using project: $XCODEPROJ"
          echo "Using scheme: $SCHEME"

      - name: Write Secrets xcconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p configuration
          echo "API_KEY = ${{ secrets.API_KEY }}" > configuration/Secrets.xcconfig

      - name: Pick an iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          # xcrun xctrace returns via stderr, not the expected stdout
          DEVICE="$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e 's/ Simulator$//')"
          if [ -z "${DEVICE:-}" ]; then
            echo "Could not find an iPhone simulator device name." >&2
            exit 1
          fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "Using device: $DEVICE"

      - name: Build (for testing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath BuildResults.xcresult

      - name: Test (no build)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -testPlan sgairquality \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Convert Coverage to LCOV
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "TestResults.xcresult" ]; then
            echo "Missing TestResults.xcresult" >&2
            exit 1
          fi

          brew install xcresultparser 2>/dev/null || true
          xcresultparser --output-format lcov TestResults.xcresult > coverage.lcov

          echo "Generated coverage.lcov:"
          ls -lah coverage.lcov

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: unittests
          fail_ci_if_error: false
          disable_search: true
